<svg xmlns="http://www.w3.org/2000/svg" width="320" height="640" viewBox="0 0 320 640" font-family="'Segoe UI', 'Inter', Arial, sans-serif">
  <rect x="4" y="4" width="312" height="632" rx="38" fill="#0B0E14" stroke="#2D3748" stroke-width="4"/>
  <rect x="12" y="12" width="296" height="616" rx="32" fill="#0F131A"/>
  <circle cx="160" cy="26" r="5" fill="#05070A"/>
  <text x="32" y="30" font-size="10" font-weight="600" fill="#E2E8F0">12:35</text>
  <text x="255" y="30" font-size="10" font-weight="600" fill="#E2E8F0">5G 100%</text>

  <!-- AppBar -->
  <text x="160" y="62" font-size="16.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">Settings &amp; Cloud Backup</text>

  <!-- Section 1: Google Drive Backup -->
  <text x="26" y="92" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.8">GOOGLE DRIVE BACKUP</text>
  <rect x="24" y="100" width="272" height="196" rx="16" fill="#171C26" stroke="#262F40"/>

  <!-- Connected Profile Picture + Official Google Drive Triangle Badge -->
  <defs>
    <linearGradient id="avatarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#1A73E8"/>
    </linearGradient>
  </defs>
  <circle cx="58" cy="136" r="22" fill="url(#avatarGrad)" stroke="#334155" stroke-width="1.5"/>
  <text x="58" y="143" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">J</text>
  <!-- Drive Badge on Bottom-Right of Profile Avatar -->
  <circle cx="74" cy="152" r="9" fill="#1E2430" stroke="#334155" stroke-width="1.2"/>
  <polygon points="74,146 79,154 69,154" fill="#00AC47"/>
  <polygon points="74,146 79,154 76,154" fill="#FFBA00"/>
  <polygon points="69,154 79,154 77,157 71,157" fill="#2684FC"/>

  <!-- User Name, Connected Badge, Email & Sync Status -->
  <text x="92" y="125" font-size="13.5" font-weight="700" fill="#FFFFFF">Jawaan Santh</text>
  <rect x="184" y="113" width="58" height="16" rx="8" fill="#22C55E" fill-opacity="0.18" stroke="#22C55E"/>
  <text x="213" y="124" font-size="8.5" font-weight="700" fill="#4ADE80" text-anchor="middle">Connected</text>

  <text x="92" y="141" font-size="10.5" fill="#94A3B8">jawaan25fcrit@gmail.com</text>
  <!-- Mini Google Drive Triangle + Synced count -->
  <polygon points="96,149 100,156 92,156" fill="#00AC47"/>
  <polygon points="96,149 100,156 98,156" fill="#FFBA00"/>
  <polygon points="92,156 100,156 99,158 93,158" fill="#2684FC"/>
  <text x="105" y="157" font-size="9.5" font-weight="600" fill="#CBD5E1">4 of 4 PDFs synced to "Scanora Documents"</text>

  <line x1="38" y1="172" x2="282" y2="172" stroke="#262F40"/>

  <!-- Auto-Backup Toggle -->
  <text x="38" y="194" font-size="12" font-weight="600" fill="#F8FAFC">Auto-Backup New Scans</text>
  <text x="38" y="208" font-size="9.5" fill="#94A3B8">Upload new PDFs automatically to Drive</text>
  <rect x="242" y="186" width="38" height="20" rx="10" fill="#EA580C"/>
  <circle cx="270" cy="196" r="7.5" fill="#FFFFFF"/>

  <!-- Sync Now & Sign Out Buttons -->
  <rect x="38" y="242" width="146" height="38" rx="10" fill="#EA580C"/>
  <text x="111" y="265" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">↻ Sync Now</text>

  <rect x="194" y="242" width="88" height="38" rx="10" fill="#1E2430" stroke="#334155"/>
  <text x="238" y="265" font-size="11.5" font-weight="600" fill="#CBD5E1" text-anchor="middle">Sign Out</text>

  <!-- Section 2: Security & Anti-Fraud Defaults -->
  <text x="26" y="320" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.8">SECURITY &amp; ANTI-FRAUD DEFAULTS</text>
  <rect x="24" y="328" width="272" height="118" rx="16" fill="#171C26" stroke="#262F40"/>

  <text x="40" y="358" font-size="16">👆</text>
  <text x="68" y="354" font-size="12.5" font-weight="700" fill="#F8FAFC">Biometric App Lock</text>
  <text x="68" y="368" font-size="9.5" fill="#94A3B8">Require fingerprint, face, or PIN on launch</text>
  <rect x="242" y="346" width="38" height="20" rx="10" fill="#EA580C"/>
  <circle cx="270" cy="356" r="7.5" fill="#FFFFFF"/>

  <line x1="38" y1="386" x2="282" y2="386" stroke="#262F40"/>

  <text x="40" y="416" font-size="16">🛡️</text>
  <text x="68" y="412" font-size="12.5" font-weight="700" fill="#F8FAFC">Default Watermark Stamp</text>
  <text x="68" y="426" font-size="9.5" fill="#94A3B8">Preset text: "CONFIDENTIAL"</text>
  <text x="268" y="418" font-size="13" fill="#94A3B8">✎</text>

  <!-- Section 3: Appearance -->
  <text x="26" y="470" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.8">APPEARANCE</text>
  <rect x="24" y="478" width="272" height="72" rx="16" fill="#171C26" stroke="#262F40"/>
  <rect x="38" y="496" width="80" height="34" rx="17" fill="#EA580C"/>
  <text x="78" y="517" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓ System</text>
  <rect x="120" y="496" width="80" height="34" rx="17" fill="#1E2430" stroke="#334155"/>
  <text x="160" y="517" font-size="11" fill="#CBD5E1" text-anchor="middle">☀ Light</text>
  <rect x="202" y="496" width="80" height="34" rx="17" fill="#1E2430" stroke="#334155"/>
  <text x="242" y="517" font-size="11" fill="#CBD5E1" text-anchor="middle">🌙 Dark</text>
</svg>

