<svg xmlns="http://www.w3.org/2000/svg" width="320" height="640" viewBox="0 0 320 640" font-family="'Segoe UI', 'Inter', Arial, sans-serif">
  <rect x="4" y="4" width="312" height="632" rx="38" fill="#0B0E14" stroke="#2D3748" stroke-width="4"/>
  <rect x="12" y="12" width="296" height="616" rx="32" fill="#101216"/>
  <circle cx="160" cy="26" r="5" fill="#05070A"/>
  <text x="32" y="30" font-size="10" font-weight="600" fill="#E2E8F0">12:31</text>
  <text x="255" y="30" font-size="10" font-weight="600" fill="#E2E8F0">5G 100%</text>

  <!-- AppBar -->
  <text x="28" y="64" font-size="16" fill="#FFFFFF">✕</text>
  <text x="54" y="64" font-size="15" font-weight="700" fill="#FFFFFF">Page 1 of 4</text>
  <rect x="214" y="44" width="80" height="30" rx="9" fill="#EA580C"/>
  <text x="254" y="63" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓ Save PDF</text>

  <!-- Scanned Document Page Preview -->
  <rect x="44" y="86" width="232" height="296" rx="10" fill="#FFFFFF"/>
  <rect x="64" y="108" width="110" height="10" rx="3" fill="#1E293B"/>
  <rect x="64" y="128" width="190" height="6" rx="3" fill="#475569"/>
  <rect x="64" y="140" width="175" height="6" rx="3" fill="#475569"/>
  <rect x="64" y="152" width="184" height="6" rx="3" fill="#475569"/>
  <rect x="64" y="174" width="190" height="58" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <rect x="74" y="186" width="90" height="7" rx="3" fill="#0F172A"/>
  <rect x="74" y="200" width="150" height="6" rx="3" fill="#334155"/>
  <rect x="74" y="212" width="130" height="6" rx="3" fill="#334155"/>
  <rect x="64" y="248" width="185" height="6" rx="3" fill="#475569"/>
  <rect x="64" y="260" width="160" height="6" rx="3" fill="#475569"/>
  <rect x="64" y="272" width="178" height="6" rx="3" fill="#475569"/>
  <rect x="174" y="336" width="66" height="22" rx="6" fill="#EA580C" fill-opacity="0.15"/>
  <text x="207" y="351" font-size="9" font-weight="700" fill="#EA580C" text-anchor="middle">✨ Enhanced</text>

  <!-- Multi-page Thumbnail Strip -->
  <g transform="translate(28, 394)">
    <rect x="0" y="0" width="42" height="54" rx="6" fill="#FFF" stroke="#EA580C" stroke-width="2.5"/>
    <text x="33" y="49" font-size="8" font-weight="700" fill="#EA580C">1</text>
    <rect x="52" y="0" width="42" height="54" rx="6" fill="#E2E8F0" stroke="#334155"/>
    <text x="85" y="49" font-size="8" font-weight="700" fill="#475569">2</text>
    <rect x="104" y="0" width="42" height="54" rx="6" fill="#E2E8F0" stroke="#334155"/>
    <text x="137" y="49" font-size="8" font-weight="700" fill="#475569">3</text>
    <rect x="156" y="0" width="42" height="54" rx="6" fill="#E2E8F0" stroke="#334155"/>
    <text x="189" y="49" font-size="8" font-weight="700" fill="#475569">4</text>
  </g>

  <!-- Apply to All Pages Bar + Filter Chips -->
  <rect x="12" y="458" width="296" height="78" fill="#14171E" stroke="#222734"/>
  <!-- Checkbox: Apply filter to all 4 pages -->
  <rect x="24" y="468" width="15" height="15" rx="4" fill="#EA580C"/>
  <text x="31.5" y="479" font-size="10" font-weight="800" fill="#FFF" text-anchor="middle">✓</text>
  <text x="45" y="479" font-size="10.5" font-weight="600" fill="#F8FAFC">Apply filter to all 4 pages</text>

  <!-- Pill: Apply Enhance to all -->
  <rect x="182" y="465" width="114" height="21" rx="10.5" fill="#EA580C" fill-opacity="0.22" stroke="#EA580C"/>
  <text x="239" y="479" font-size="9.5" font-weight="700" fill="#FB923C" text-anchor="middle">✓ Applied to all (4)</text>

  <!-- 4 Filter Pills -->
  <rect x="20" y="496" width="64" height="28" rx="14" fill="#1E232E" stroke="#334155"/>
  <text x="52" y="514" font-size="10" fill="#CBD5E1" text-anchor="middle">Original</text>

  <rect x="90" y="496" width="68" height="28" rx="14" fill="#EA580C"/>
  <text x="124" y="514" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">✨ Enhance</text>

  <rect x="164" y="496" width="70" height="28" rx="14" fill="#1E232E" stroke="#334155"/>
  <text x="199" y="514" font-size="10" fill="#CBD5E1" text-anchor="middle">Grayscale</text>

  <rect x="240" y="496" width="58" height="28" rx="14" fill="#1E232E" stroke="#334155"/>
  <text x="269" y="514" font-size="10" fill="#CBD5E1" text-anchor="middle">B &amp; W</text>

  <!-- Bottom Action Bar -->
  <rect x="12" y="536" width="296" height="92" rx="24" fill="#181B22"/>
  <g font-size="9.5" fill="#CBD5E1" text-anchor="middle">
    <text x="44" y="568" font-size="16">➕</text><text x="44" y="588">Add Page</text>
    <text x="102" y="568" font-size="16">✂️</text><text x="102" y="588">Crop</text>
    <text x="160" y="568" font-size="16">🎨</text><text x="160" y="588">Filters</text>
    <text x="218" y="568" font-size="16">🔄</text><text x="218" y="588">Rotate</text>
    <text x="274" y="568" font-size="16">🗑️</text><text x="274" y="588" fill="#EF4444">Delete</text>
  </g>
</svg>

