<svg xmlns="http://www.w3.org/2000/svg" width="320" height="640" viewBox="0 0 320 640" font-family="'Segoe UI', 'Inter', Arial, sans-serif">
  <rect x="4" y="4" width="312" height="632" rx="38" fill="#0B0E14" stroke="#2D3748" stroke-width="4"/>
  <rect x="12" y="12" width="296" height="616" rx="32" fill="#0A0D12"/>
  <circle cx="160" cy="26" r="5" fill="#05070A"/>

  <!-- Bottom Sheet Container -->
  <rect x="12" y="64" width="296" height="564" rx="28" fill="#151922" stroke="#262F40"/>
  <rect x="136" y="74" width="48" height="4" rx="2" fill="#475569"/>

  <text x="28" y="106" font-size="17" font-weight="800" fill="#FFFFFF">Save Document</text>
  <text x="280" y="106" font-size="15" fill="#94A3B8">✕</text>

  <!-- Document Name -->
  <text x="28" y="132" font-size="11" font-weight="600" fill="#CBD5E1">Document Name</text>
  <rect x="28" y="140" width="264" height="38" rx="10" fill="#1C222E" stroke="#334155"/>
  <text x="42" y="164" font-size="12" fill="#F8FAFC">📄 Aadhaar_KYC_Verified</text>

  <!-- Destination Folder -->
  <text x="28" y="198" font-size="11" font-weight="600" fill="#CBD5E1">Destination Folder</text>
  <rect x="28" y="206" width="264" height="38" rx="10" fill="#1C222E" stroke="#334155"/>
  <text x="42" y="230" font-size="12" fill="#F8FAFC">📁 Personal IDs &amp; KYC</text>
  <text x="178" y="230" font-size="10" font-weight="700" fill="#FB923C">(Biometric Vault)</text>

  <!-- Security, Watermark & Cloud Box -->
  <rect x="28" y="258" width="264" height="282" rx="14" fill="#1B222E" stroke="#2E384D"/>
  <text x="42" y="280" font-size="12" font-weight="700" fill="#FB923C">🛡️ Security, Watermark &amp; Cloud</text>

  <!-- Watermark Toggle -->
  <text x="42" y="304" font-size="12" font-weight="600" fill="#F8FAFC">Anti-Fraud Watermark</text>
  <text x="42" y="318" font-size="9.5" fill="#94A3B8">Stamp diagonal anti-misuse text</text>
  <rect x="242" y="294" width="36" height="20" rx="10" fill="#EA580C"/>
  <circle cx="268" cy="304" r="7.5" fill="#FFFFFF"/>

  <!-- Watermark Presets -->
  <rect x="42" y="328" width="76" height="22" rx="11" fill="#242C3D"/>
  <text x="80" y="342" font-size="8.5" fill="#CBD5E1" text-anchor="middle">CONFIDENTIAL</text>
  <rect x="124" y="328" width="76" height="22" rx="11" fill="#EA580C"/>
  <text x="162" y="342" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">FOR KYC ONLY</text>
  <rect x="206" y="328" width="72" height="22" rx="11" fill="#242C3D"/>
  <text x="242" y="342" font-size="8.5" fill="#CBD5E1" text-anchor="middle">DO NOT COPY</text>

  <line x1="42" y1="362" x2="278" y2="362" stroke="#2E384D"/>

  <!-- Password Lock -->
  <text x="42" y="384" font-size="12" font-weight="600" fill="#F8FAFC">Lock with Password</text>
  <text x="42" y="398" font-size="9.5" fill="#94A3B8">Standard AES-128 PDF encryption</text>
  <rect x="242" y="374" width="36" height="20" rx="10" fill="#EA580C"/>
  <circle cx="268" cy="384" r="7.5" fill="#FFFFFF"/>

  <rect x="42" y="408" width="236" height="34" rx="8" fill="#141923" stroke="#334155"/>
  <text x="54" y="429" font-size="12" fill="#F8FAFC">🔒 • • • • • • • •</text>

  <line x1="42" y1="454" x2="278" y2="454" stroke="#2E384D"/>

  <!-- Google Drive Auto-Backup Row with Official Drive Triangle -->
  <polygon points="48,472 54,482 42,482" fill="#00AC47"/>
  <polygon points="48,472 54,482 51,482" fill="#FFBA00"/>
  <polygon points="42,482 54,482 52,485 44,485" fill="#2684FC"/>
  <text x="62" y="478" font-size="12" font-weight="600" fill="#F8FAFC">Backup to Google Drive</text>
  <text x="62" y="492" font-size="9.5" fill="#94A3B8">Save to "Scanora Documents" folder</text>
  <rect x="242" y="470" width="36" height="20" rx="10" fill="#22C55E"/>
  <circle cx="268" cy="480" r="7.5" fill="#FFFFFF"/>

  <!-- Save Button -->
  <rect x="28" y="556" width="264" height="46" rx="12" fill="#EA580C"/>
  <text x="160" y="584" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Save as PDF</text>
</svg>

