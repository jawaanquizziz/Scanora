<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="'Segoe UI', 'Inter', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="55%" stop-color="#161B26"/>
      <stop offset="100%" stop-color="#2A1408"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FB923C">
        <animate attributeName="stop-color" values="#FB923C;#EF4444;#FB923C" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#EA580C">
        <animate attributeName="stop-color" values="#EA580C;#F97316;#EA580C" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="docClip"><rect x="860" y="70" width="210" height="280" rx="14"/></clipPath>
    <style>
      .float1 { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float 7s ease-in-out infinite 1s; }
      .float3 { animation: float 8s ease-in-out infinite 2s; }
      .fade { animation: fadeIn 1.6s ease-out both; }
      .fade2 { animation: fadeIn 1.6s ease-out 0.4s both; }
      .fade3 { animation: fadeIn 1.6s ease-out 0.8s both; }
      .line { animation: grow 2.4s ease-in-out infinite alternate; transform-origin: left; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes grow { from { transform: scaleX(0.35); } to { transform: scaleX(1); } }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200M0 360H1200"/>
    <path d="M100 0V420M200 0V420M300 0V420M400 0V420M500 0V420M600 0V420M700 0V420M800 0V420M900 0V420M1000 0V420M1100 0V420"/>
  </g>

  <circle cx="965" cy="210" r="230" fill="url(#glow)"/>

  <!-- Title -->
  <g class="fade">
    <text x="80" y="150" font-size="84" font-weight="800" fill="url(#brand)" letter-spacing="-2">Scanora</text>
  </g>
  <g class="fade2">
    <text x="84" y="200" font-size="26" font-weight="600" fill="#E5E7EB">Scan. Secure. Understand.</text>
    <text x="84" y="240" font-size="18" fill="#9CA3AF">Privacy-first AI document scanner with on-device LLM,</text>
    <text x="84" y="266" font-size="18" fill="#9CA3AF">AES PDF encryption, anti-fraud watermarks &amp; biometric vault.</text>
  </g>

  <!-- chips -->
  <g class="fade3" font-size="14" font-weight="600">
    <g transform="translate(84,300)">
      <rect width="150" height="36" rx="18" fill="#F97316" fill-opacity="0.14" stroke="#F97316" stroke-opacity="0.5"/>
      <text x="75" y="23" text-anchor="middle" fill="#FDBA74">100% Offline AI</text>
    </g>
    <g transform="translate(246,300)">
      <rect width="150" height="36" rx="18" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-opacity="0.5"/>
      <text x="75" y="23" text-anchor="middle" fill="#86EFAC">AES-128 Lock</text>
    </g>
    <g transform="translate(408,300)">
      <rect width="150" height="36" rx="18" fill="#3B82F6" fill-opacity="0.12" stroke="#3B82F6" stroke-opacity="0.5"/>
      <text x="75" y="23" text-anchor="middle" fill="#93C5FD">Biometric Vault</text>
    </g>
    <g transform="translate(570,300)">
      <rect width="150" height="36" rx="18" fill="#EAB308" fill-opacity="0.12" stroke="#EAB308" stroke-opacity="0.5"/>
      <text x="75" y="23" text-anchor="middle" fill="#FDE047">Drive Backup</text>
    </g>
  </g>

  <!-- Animated document being scanned -->
  <g class="float1">
    <rect x="860" y="70" width="210" height="280" rx="14" fill="#F8FAFC"/>
    <g clip-path="url(#docClip)">
      <rect x="884" y="98" width="110" height="14" rx="4" fill="#EA580C"/>
      <rect x="884" y="130" width="162" height="8" rx="4" fill="#CBD5E1" class="line"/>
      <rect x="884" y="148" width="140" height="8" rx="4" fill="#CBD5E1" class="line"/>
      <rect x="884" y="166" width="155" height="8" rx="4" fill="#CBD5E1" class="line"/>
      <rect x="884" y="184" width="120" height="8" rx="4" fill="#CBD5E1" class="line"/>
      <rect x="884" y="214" width="162" height="60" rx="8" fill="#FFEDD5"/>
      <rect x="896" y="228" width="90" height="8" rx="4" fill="#FB923C"/>
      <rect x="896" y="246" width="130" height="8" rx="4" fill="#FDBA74"/>
      <rect x="884" y="290" width="150" height="8" rx="4" fill="#CBD5E1"/>
      <rect x="884" y="308" width="100" height="8" rx="4" fill="#CBD5E1"/>
      <!-- diagonal watermark -->
      <text x="965" y="230" font-size="22" font-weight="800" fill="#EF4444" fill-opacity="0.18" text-anchor="middle" transform="rotate(-35 965 230)">CONFIDENTIAL</text>
      <!-- scan beam -->
      <rect x="860" y="60" width="210" height="40" fill="url(#scan)">
        <animate attributeName="y" values="50;330;50" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- corner brackets -->
    <g stroke="#F97316" stroke-width="5" fill="none" stroke-linecap="round" class="pulse">
      <path d="M848 98V58H888"/>
      <path d="M1042 58H1082V98"/>
      <path d="M1082 322V362H1042"/>
      <path d="M888 362H848V322"/>
    </g>
  </g>

  <!-- floating badges -->
  <g class="float2">
    <rect x="1050" y="250" width="120" height="64" rx="16" fill="#111827" stroke="#22C55E" stroke-opacity="0.6"/>
    <path d="M1074 270h16a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4h-16a4 4 0 0 1-4-4v-18a4 4 0 0 1 4-4z" fill="#22C55E"/>
    <path d="M1076 270v-6a6 6 0 0 1 12 0v6" stroke="#22C55E" stroke-width="3" fill="none"/>
    <text x="1104" y="280" font-size="12" fill="#9CA3AF">PDF</text>
    <text x="1104" y="298" font-size="14" font-weight="700" fill="#86EFAC">Locked</text>
  </g>
  <g class="float3">
    <rect x="760" y="90" width="132" height="64" rx="16" fill="#111827" stroke="#F97316" stroke-opacity="0.6"/>
    <circle cx="790" cy="122" r="14" fill="#F97316"/>
    <text x="790" y="127" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">AI</text>
    <text x="812" y="116" font-size="12" fill="#9CA3AF">On-device</text>
    <text x="812" y="134" font-size="14" font-weight="700" fill="#FDBA74">SmolLM2</text>
  </g>
</svg>
